<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Export Aggregated Data</title>
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            height: 60px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f7f7f7;
        }

        h1 {
            margin: 0;
        }

        .toolbar {
            background: #ffffff;
            padding: 15px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .toolbar label {
            margin-right: 8px;
            font-weight: bold;
        }

        .toolbar input,
        .toolbar select,
        .toolbar button {
            margin-right: 15px;
            margin-bottom: 10px;
            padding: 6px 10px;
        }

        .filter-blocks {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .checklist-block {
            width: 280px;
        }

        .checklist-block label {
            display: block;
            margin-bottom: 6px;
        }

        .checklist-search {
            width: 250px;
            margin-bottom: 8px;
        }

        .checklist-box {
            border: 1px solid #ccc;
            background: #fff;
            min-height: 180px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px;
        }

        .checklist-item {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .checklist-item.hidden-item {
            display: none;
        }

        .checklist-actions {
            margin-top: 6px;
        }

        .checklist-actions button {
            margin-right: 6px;
            margin-bottom: 4px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .free-filter-block {
            min-width: 340px;
        }

        .table-container {
            background: #ffffff;
            border: 1px solid #ddd;
            padding: 10px;
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #dcdcdc;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #efefef;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        tr:nth-child(even) {
            background: #fafafa;
        }

        tr.selected-row {
            background: #fff7d6 !important;
        }

        tr.selected-outside-filter {
            background: #ffe9b3 !important;
        }

        .actions {
            margin-top: 15px;
        }

        .actions button {
            padding: 8px 14px;
            margin-right: 10px;
        }

        .small {
            font-size: 12px;
            color: #666;
        }

        #status {
            margin-top: 10px;
            color: #444;
            font-size: 13px;
        }

        .disabled-field {
            background: #f0f0f0;
            color: #666;
        }

        .legend {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }

        .legend span {
            display: inline-block;
            margin-right: 15px;
        }

        .legend-box {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            vertical-align: middle;
            border: 1px solid #ccc;
        }

        .legend-selected {
            background: #fff7d6;
        }

        .legend-outside {
            background: #ffe9b3;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:15px;">
            <h1>Export dati aggregati</h1>
        </div>
        <div style="display:flex; align-items:center; gap:15px;">
            <span style="font-size:13px; color:#444;">Utente: {{ logged_user_name }}</span>
            <a href="/logout" style="text-decoration:none; color:#1f4e79; font-weight:bold;">Logout</a>
            <img src="/static/logo_aircare.png" class="logo" alt="Aircare logo">
        </div>
    </div>

    <form method="POST" action="/export" id="exportForm">
        <div class="toolbar">
            <div>
                <label for="periodPreset">Periodo</label>
                <select id="periodPreset" name="periodPreset">
                    <option value="current_month">Mese attuale</option>
                    <option value="last_month">Ultimo mese</option>
                    <option value="current_year">Anno attuale</option>
                    <option value="last_year">Ultimo anno</option>
                    <option value="custom">Custom</option>
                </select>

                <label for="date_from">Data inizio</label>
                <input type="datetime-local" id="date_from" name="date_from" required>

                <label for="date_to">Data fine</label>
                <input type="datetime-local" id="date_to" name="date_to" required>

                <label for="resolution">Aggregazione</label>
                <select id="resolution" name="resolution">
                    <option value="15m">15 minuti</option>
                    <option value="hour">Oraria</option>
                    <option value="day">Giornaliera</option>
                    <option value="month">Mensile</option>
                </select>
            </div>

            <div class="filter-blocks">
                <div class="checklist-block">
                    <label for="targetSearch">Cerca Target</label>
                    <input type="text" id="targetSearch" class="checklist-search" placeholder="Scrivi uno o più target...">

                    <label>Target</label>
                    <div id="targetChecklist" class="checklist-box"></div>

                    <div class="checklist-actions">
                        <button type="button" onclick="selectAllVisibleChecklist('targetChecklist')">Seleziona target visibili</button>
                        <button type="button" onclick="clearAllChecklist('targetChecklist')">Azzera target</button>
                    </div>
                </div>

                <div class="checklist-block">
                    <label for="resourceSearch">Cerca Resource</label>
                    <input type="text" id="resourceSearch" class="checklist-search" placeholder="Scrivi una o più resource...">

                    <label>Resource</label>
                    <div id="resourceChecklist" class="checklist-box"></div>

                    <div class="checklist-actions">
                        <button type="button" onclick="selectAllVisibleChecklist('resourceChecklist')">Seleziona resource visibili</button>
                        <button type="button" onclick="clearAllChecklist('resourceChecklist')">Azzera resource</button>
                    </div>
                </div>

                <div class="free-filter-block">
                    <label for="filterInput">Filtro libero</label>
                    <input type="text" id="filterInput" placeholder="Scrivi per filtrare..." style="width:300px;">

                    <div style="margin-top:12px;">
                        <button type="button" onclick="selectAllRows()">Seleziona tutto</button>
                        <button type="button" onclick="deselectAllRows()">Deseleziona tutto</button>
                        <button type="button" onclick="selectFilteredRows()">Seleziona filtrati</button>
                        <button type="button" onclick="deselectFilteredRows()">Deseleziona filtrati</button>
                    </div>
                </div>
            </div>

            <div style="margin-top:10px;">
                <label for="savedSelectionName">Nome selezione</label>
                <input type="text" id="savedSelectionName" placeholder="Es. Cabina Savona">

                <button type="button" onclick="saveCurrentSelection()">Salva selezione</button>

                <label for="savedSelections">Selezioni salvate</label>
                <select id="savedSelections">
                    <option value="">Seleziona...</option>
                </select>

                <button type="button" onclick="loadSavedSelection()">Carica</button>
                <button type="button" onclick="deleteSavedSelection()">Elimina</button>
            </div>

            <div id="status" class="small"></div>
            <div class="legend">
                <span><span class="legend-box legend-selected"></span>Selezionata</span>
                <span><span class="legend-box legend-outside"></span>Selezionata fuori filtro</span>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Seleziona</th>
                        <th>Target</th>
                        <th>Resource</th>
                        <th>UM</th>
                        <th>Tipologia</th>
                    </tr>
                </thead>
                <tbody id="rowsTableBody"></tbody>
            </table>
        </div>

        <div class="actions">
            <button type="submit">Esporta Excel</button>
        </div>
    </form>

    <script>
        let allData = [];
        let filteredData = [];
        let debounceTimer = null;
        let selectedKeys = {};

        async function loadRows() {
            const status = document.getElementById('status');
            status.innerText = 'Caricamento righe...';

            try {
                const res = await fetch('/api/index_rows');
                const rawData = await res.json();

                allData = rawData.map(row => {
                    const target = row.target || '';
                    const resource = row.resource || '';
                    const um = row.um || '';
                    const tipologiaText = String(row.crescente) === '1' ? 'Crescente' : 'Oscillante';
                    const searchText = normalizeText(
                        target + ' ' + resource + ' ' + um + ' ' + tipologiaText
                    );

                    return {
                        target: target,
                        resource: resource,
                        um: um,
                        crescente: row.crescente,
                        tipologiaText: tipologiaText,
                        searchText: searchText,
                        key: target + '|' + resource
                    };
                });

                renderChecklist('targetChecklist', [...new Set(allData.map(row => row.target))].sort(), 'target');
                renderChecklist('resourceChecklist', [...new Set(allData.map(row => row.resource))].sort(), 'resource');

                await refreshSavedSelectionsDropdown();
                applyFilters();
            } catch (err) {
                document.getElementById('rowsTableBody').innerHTML = '';
                status.innerText = 'Errore nel caricamento righe';
                console.error(err);
            }
        }

        function renderChecklist(containerId, items, type) {
            const container = document.getElementById(containerId);
            let html = '';

            items.forEach(item => {
                const itemEscaped = escapeHtml(item);
                html += `
                    <label class="checklist-item" data-value="${itemEscaped}">
                        <input type="checkbox" data-type="${type}" value="${itemEscaped}">
                        ${itemEscaped}
                    </label>
                `;
            });

            container.innerHTML = html;
        }

        function getCheckedChecklistValues(containerId) {
            const container = document.getElementById(containerId);
            return Array.from(container.querySelectorAll('input[type="checkbox"]:checked'))
                .map(cb => cb.value.toLowerCase());
        }

        function selectAllVisibleChecklist(containerId) {
            const container = document.getElementById(containerId);
            Array.from(container.querySelectorAll('.checklist-item')).forEach(label => {
                if (!label.classList.contains('hidden-item')) {
                    const cb = label.querySelector('input[type="checkbox"]');
                    if (cb) cb.checked = true;
                }
            });
            applyFilters();
        }

        function clearAllChecklist(containerId) {
            const container = document.getElementById(containerId);
            Array.from(container.querySelectorAll('input[type="checkbox"]')).forEach(cb => {
                cb.checked = false;
            });
            applyFilters();
        }

        function filterChecklist(containerId, searchId) {
            const container = document.getElementById(containerId);
            const rawInput = document.getElementById(searchId).value || '';

            const terms = rawInput
                .toLowerCase()
                .split(/[\s,;]+/)
                .map(t => normalizeText(t))
                .filter(t => t.length > 0);

            Array.from(container.querySelectorAll('.checklist-item')).forEach(label => {
                const itemText = normalizeText(label.getAttribute('data-value') || '');
                const match = terms.length === 0 || terms.some(term => itemText.includes(term));
                label.classList.toggle('hidden-item', !match);
            });
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function normalizeText(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .toLowerCase()
                .replace(/[_\s\-\/]+/g, '');
        }

        function formatDateTimeLocal(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            const hours = String(dateObj.getHours()).padStart(2, '0');
            const minutes = String(dateObj.getMinutes()).padStart(2, '0');

            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function setDateRangeByPreset() {
            const preset = document.getElementById('periodPreset').value;
            const dateFrom = document.getElementById('date_from');
            const dateTo = document.getElementById('date_to');

            const now = new Date();
            let fromDate = null;
            let toDate = null;

            if (preset === 'current_month') {
                fromDate = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
                toDate = new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0, 0);
            } else if (preset === 'last_month') {
                fromDate = new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0);
                toDate = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
            } else if (preset === 'current_year') {
                fromDate = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
                toDate = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0, 0);
            } else if (preset === 'last_year') {
                fromDate = new Date(now.getFullYear() - 1, 0, 1, 0, 0, 0, 0);
                toDate = new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0);
            }

            if (preset === 'custom') {
                dateFrom.disabled = false;
                dateTo.disabled = false;
                dateFrom.classList.remove('disabled-field');
                dateTo.classList.remove('disabled-field');
            } else {
                dateFrom.value = formatDateTimeLocal(fromDate);
                dateTo.value = formatDateTimeLocal(toDate);
                dateFrom.disabled = true;
                dateTo.disabled = true;
                dateFrom.classList.add('disabled-field');
                dateTo.classList.add('disabled-field');
            }
        }

        function enableDatesBeforeSubmit() {
            const dateFrom = document.getElementById('date_from');
            const dateTo = document.getElementById('date_to');

            if (dateFrom.disabled) dateFrom.disabled = false;
            if (dateTo.disabled) dateTo.disabled = false;
        }

        function syncHiddenSelectedRows() {
            const form = document.getElementById('exportForm');

            const oldHidden = form.querySelectorAll('input[data-hidden-selected="1"]');
            oldHidden.forEach(el => el.remove());

            Object.keys(selectedKeys).forEach(key => {
                if (selectedKeys[key]) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'selected_rows';
                    input.value = key;
                    input.setAttribute('data-hidden-selected', '1');
                    form.appendChild(input);
                }
            });
        }

        async function fetchSavedSelections() {
            const res = await fetch('/api/saved_selections');
            if (!res.ok) throw new Error('Errore caricamento selezioni salvate');
            return await res.json();
        }

        async function refreshSavedSelectionsDropdown() {
            const dropdown = document.getElementById('savedSelections');
            const saved = await fetchSavedSelections();

            dropdown.innerHTML = '<option value="">Seleziona...</option>';

            saved.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.name;
                opt.textContent = item.name;
                dropdown.appendChild(opt);
            });
        }

        async function saveCurrentSelection() {
            const name = (document.getElementById('savedSelectionName').value || '').trim();

            if (!name) {
                alert('Inserire un nome per la selezione.');
                return;
            }

            const keys = Object.keys(selectedKeys).filter(k => selectedKeys[k]);

            if (!keys.length) {
                alert('Nessuna risorsa selezionata da salvare.');
                return;
            }

            const res = await fetch('/api/saved_selections', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, keys: keys})
            });

            const data = await res.json();

            if (!res.ok) {
                alert(data.error || 'Errore salvataggio selezione.');
                return;
            }

            await refreshSavedSelectionsDropdown();
            document.getElementById('savedSelections').value = name;
            alert('Selezione salvata.');
        }

        async function loadSavedSelection() {
            const name = document.getElementById('savedSelections').value;
            if (!name) {
                alert('Selezionare una configurazione salvata.');
                return;
            }

            const saved = await fetchSavedSelections();
            const item = saved.find(x => x.name === name);

            if (!item) {
                alert('Selezione non trovata.');
                return;
            }

            selectedKeys = {};
            (item.keys || []).forEach(k => {
                selectedKeys[k] = true;
            });

            applyFilters();
        }

        async function deleteSavedSelection() {
            const name = document.getElementById('savedSelections').value;
            if (!name) {
                alert('Selezionare una configurazione da eliminare.');
                return;
            }

            const res = await fetch('/api/saved_selections/' + encodeURIComponent(name), {
                method: 'DELETE'
            });

            if (!res.ok) {
                alert('Errore eliminazione selezione.');
                return;
            }

            await refreshSavedSelectionsDropdown();
            alert('Selezione eliminata.');
        }

        function applyFilters() {
            const selectedTargets = getCheckedChecklistValues('targetChecklist');
            const selectedResources = getCheckedChecklistValues('resourceChecklist');
            const textFilter = normalizeText(document.getElementById('filterInput').value || '');

            filteredData = allData.filter(row => {
                const matchTarget = selectedTargets.length === 0 || selectedTargets.includes(row.target.toLowerCase());
                const matchResource = selectedResources.length === 0 || selectedResources.includes(row.resource.toLowerCase());
                const matchText = !textFilter || row.searchText.includes(textFilter);

                const selected = !!selectedKeys[row.key];

                return (matchTarget && matchResource && matchText) || selected;
            });

            renderTable(filteredData, {
                selectedTargets: selectedTargets,
                selectedResources: selectedResources,
                textFilter: textFilter
            });
        }

        function rowMatchesCurrentFilter(row, filters) {
            const matchTarget = filters.selectedTargets.length === 0 || filters.selectedTargets.includes(row.target.toLowerCase());
            const matchResource = filters.selectedResources.length === 0 || filters.selectedResources.includes(row.resource.toLowerCase());
            const matchText = !filters.textFilter || row.searchText.includes(filters.textFilter);
            return matchTarget && matchResource && matchText;
        }

        function renderTable(data, filters) {
            const tbody = document.getElementById('rowsTableBody');
            let html = '';

            data.forEach(row => {
                const checked = selectedKeys[row.key] ? 'checked' : '';
                const selected = !!selectedKeys[row.key];
                const insideFilter = filters ? rowMatchesCurrentFilter(row, filters) : true;

                let trClass = '';
                if (selected && insideFilter) {
                    trClass = 'selected-row';
                } else if (selected && !insideFilter) {
                    trClass = 'selected-outside-filter';
                }

                html += `
                    <tr class="${trClass}">
                        <td>
                            <input type="checkbox" value="${escapeHtml(row.key)}" ${checked} onchange="toggleSelection(this)">
                        </td>
                        <td>${escapeHtml(row.target)}</td>
                        <td>${escapeHtml(row.resource)}</td>
                        <td>${escapeHtml(row.um)}</td>
                        <td>${escapeHtml(row.tipologiaText)}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
            updateStatus(filters);
        }

        function toggleSelection(cb) {
            const key = cb.value;
            if (cb.checked) {
                selectedKeys[key] = true;
            } else {
                delete selectedKeys[key];
            }
            applyFilters();
        }

        function selectAllRows() {
            allData.forEach(row => {
                selectedKeys[row.key] = true;
            });
            applyFilters();
        }

        function deselectAllRows() {
            selectedKeys = {};
            applyFilters();
        }

        function selectFilteredRows() {
            const selectedTargets = getCheckedChecklistValues('targetChecklist');
            const selectedResources = getCheckedChecklistValues('resourceChecklist');
            const textFilter = normalizeText(document.getElementById('filterInput').value || '');

            allData.forEach(row => {
                const matchTarget = selectedTargets.length === 0 || selectedTargets.includes(row.target.toLowerCase());
                const matchResource = selectedResources.length === 0 || selectedResources.includes(row.resource.toLowerCase());
                const matchText = !textFilter || row.searchText.includes(textFilter);

                if (matchTarget && matchResource && matchText) {
                    selectedKeys[row.key] = true;
                }
            });

            applyFilters();
        }

        function deselectFilteredRows() {
            const selectedTargets = getCheckedChecklistValues('targetChecklist');
            const selectedResources = getCheckedChecklistValues('resourceChecklist');
            const textFilter = normalizeText(document.getElementById('filterInput').value || '');

            allData.forEach(row => {
                const matchTarget = selectedTargets.length === 0 || selectedTargets.includes(row.target.toLowerCase());
                const matchResource = selectedResources.length === 0 || selectedResources.includes(row.resource.toLowerCase());
                const matchText = !textFilter || row.searchText.includes(textFilter);

                if (matchTarget && matchResource && matchText) {
                    delete selectedKeys[row.key];
                }
            });

            applyFilters();
        }

        function updateStatus(filters) {
            let visibleCount = filteredData.length;
            let selectedCount = Object.keys(selectedKeys).length;

            let selectedOutsideFilter = 0;
            if (filters) {
                allData.forEach(row => {
                    if (selectedKeys[row.key] && !rowMatchesCurrentFilter(row, filters)) {
                        selectedOutsideFilter += 1;
                    }
                });
            }

            document.getElementById('status').innerText =
                'Righe mostrate: ' + visibleCount +
                ' | Righe selezionate: ' + selectedCount +
                ' | Selezionate fuori filtro: ' + selectedOutsideFilter;
        }

        function bindEvents() {
            document.getElementById('targetSearch').addEventListener('input', function() {
                filterChecklist('targetChecklist', 'targetSearch');
            });

            document.getElementById('resourceSearch').addEventListener('input', function() {
                filterChecklist('resourceChecklist', 'resourceSearch');
            });

            document.getElementById('targetChecklist').addEventListener('change', function(e) {
                if (e.target && e.target.type === 'checkbox') {
                    applyFilters();
                }
            });

            document.getElementById('resourceChecklist').addEventListener('change', function(e) {
                if (e.target && e.target.type === 'checkbox') {
                    applyFilters();
                }
            });

            document.getElementById('filterInput').addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(applyFilters, 180);
            });

            document.getElementById('periodPreset').addEventListener('change', setDateRangeByPreset);

            document.getElementById('exportForm').addEventListener('submit', function() {
                enableDatesBeforeSubmit();
                syncHiddenSelectedRows();
            });
        }

        window.onload = async function() {
            bindEvents();
            setDateRangeByPreset();
            await loadRows();
        };
    </script>
</body>
</html>
